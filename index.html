<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10243a;        /* গভীর নীল-কালি */
  --ink-2:#1b3a57;
  --paper:#faf5ea;      /* কাগজের রং */
  --paper-2:#f2e9d6;
  --gold:#d8962b;       /* সোনালি */
  --gold-2:#f0b955;
  --red:#b23a2e;        /* উদীচী-লাল */
  --text:#22303f;
  --muted:#667487;
  --line:rgba(16,36,58,.12);
  --radius:16px;
  --serif:"Noto Serif Bengali","Playfair Display",Georgia,serif;
  --sans:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:var(--sans);color:var(--text);background:var(--paper);line-height:1.7;font-size:17px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}

/* ===== উপরের চিকন বার ===== */
.topbar{background:var(--ink);color:#d9e2ec;font-size:14px}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:38px;flex-wrap:wrap}
.tb-left,.tb-right{display:flex;align-items:center;gap:18px}
.tb-left a{display:inline-flex;align-items:center;gap:7px;opacity:.92}
.tb-left a:hover{color:var(--gold-2)}
.tb-left svg{width:15px;height:15px;fill:none;stroke:var(--gold-2);stroke-width:2}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:#d9e2ec;font:inherit;font-size:13px;padding:2px 13px;cursor:pointer}
.lang button.on{background:var(--gold);color:var(--ink);font-weight:700}
.social{display:flex;gap:6px;list-style:none}
.social a{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);transition:.2s}
.social a:hover{background:var(--gold);}
.social a:hover svg{fill:var(--ink);stroke:var(--ink)}
.social svg{width:14px;height:14px;fill:#e9eef4}

/* ===== নেভিগেশন ===== */
.nav{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;min-height:68px}
.logo{font-family:"Playfair Display",var(--serif);font-weight:800;font-size:28px;color:var(--ink);letter-spacing:.3px}
.logo span{color:var(--gold)}
.menu{display:flex;list-style:none;gap:4px}
.menu a{display:block;padding:8px 15px;border-radius:999px;font-weight:600;color:var(--ink);font-size:16px;transition:.2s}
.menu a:hover{background:var(--paper-2)}
.menu a.shop{background:var(--ink);color:#fff}
.menu a.shop:hover{background:var(--red)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:44px;height:40px;cursor:pointer}
.burger span{display:block;width:20px;height:2px;background:var(--ink);margin:4px auto}

/* ===== হিরো ===== */
.hero{position:relative;color:#fff;background:
  radial-gradient(circle at 85% 20%,rgba(216,150,43,.28),transparent 45%),
  radial-gradient(circle at 10% 90%,rgba(178,58,46,.25),transparent 40%),
  linear-gradient(135deg,var(--ink) 0%,var(--ink-2) 100%);
  overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;opacity:.07;background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 34px)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.25fr .9fr;gap:48px;align-items:center;padding-top:72px;padding-bottom:84px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--gold-2);font-weight:600;font-size:16px;letter-spacing:.3px;background:rgba(216,150,43,.14);border:1px solid rgba(240,185,85,.45);border-radius:999px;padding:6px 20px 6px 16px;margin-bottom:22px}
.eyebrow::before{content:"";flex:none;width:9px;height:9px;background:var(--gold-2);transform:rotate(45deg)}
.hero h1{font-family:var(--serif);font-size:clamp(30px,4.1vw,48px);line-height:1.35;font-weight:800;margin-bottom:16px;white-space:pre-line}
.hero .role{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:23px;color:var(--gold-2);font-weight:700;margin-bottom:18px}
.hero .role::before{content:"";width:40px;height:3px;border-radius:3px;background:var(--gold)}
.hero p.lead{color:#cfdbe8;max-width:560px;margin-bottom:30px;font-size:18px}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 28px;border-radius:999px;font-weight:700;font-size:16px;border:2px solid transparent;transition:.2s;cursor:pointer;font-family:inherit}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.gold:hover{background:var(--gold-2);transform:translateY(-2px)}
.btn.line{border-color:rgba(255,255,255,.45);color:#fff}
.btn.line:hover{background:#fff;color:var(--ink)}
.portrait{position:relative;justify-self:center;width:min(360px,80vw);aspect-ratio:4/5}
.portrait .frame{position:absolute;inset:0;border-radius:200px 200px 24px 24px;background:#0d1d2f;border:3px solid var(--gold);overflow:hidden}
.portrait .frame img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 0}
.portrait::after{content:"";position:absolute;inset:16px -16px -16px 16px;border:2px solid rgba(240,185,85,.4);border-radius:200px 200px 24px 24px;z-index:-1}

/* ===== পরিসংখ্যান ===== */
.stats{margin-top:-44px;position:relative;z-index:5}
.stats .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:#fff;border-radius:var(--radius);box-shadow:0 18px 40px rgba(16,36,58,.14);overflow:hidden}
.stat{padding:26px 20px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border:0}
.stat b{display:block;font-family:var(--serif);font-size:34px;color:var(--red);line-height:1.2}
.stat span{color:var(--muted);font-size:15px}

/* ===== সেকশন ===== */
section{padding:84px 0}
.sec-head{text-align:center;max-width:640px;margin:0 auto 46px}
.sec-head .tag{color:var(--red);font-weight:700;font-size:14px;letter-spacing:1px}
.sec-head h2{font-family:var(--serif);font-size:clamp(28px,4vw,40px);color:var(--ink);line-height:1.3;margin:6px 0 12px}
.sec-head h2::after{content:"";display:block;width:60px;height:4px;background:var(--gold);border-radius:4px;margin:14px auto 0}
.sec-head p{color:var(--muted)}

/* কে আমি */
.about{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px}
.card h3{font-family:var(--serif);color:var(--ink);font-size:21px;margin-bottom:14px}
.timeline{list-style:none;border-left:3px solid var(--gold);padding-left:22px}
.timeline li{position:relative;margin-bottom:18px}
.timeline li::before{content:"";position:absolute;left:-30px;top:8px;width:13px;height:13px;border-radius:50%;background:var(--paper);border:3px solid var(--red)}
.timeline b{color:var(--ink);display:block}
.timeline span{color:var(--muted);font-size:15px}

/* সংস্কৃতি */
.culture{background:var(--paper-2)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.cc{background:#fff;border-radius:var(--radius);padding:28px 22px;border-top:5px solid var(--red);box-shadow:0 8px 22px rgba(16,36,58,.06);transition:.25s}
.cc:nth-child(2){border-top-color:var(--gold)}
.cc:nth-child(3){border-top-color:var(--ink-2)}
.cc:nth-child(4){border-top-color:#2f7d6b}
.cc:hover{transform:translateY(-6px)}
.cc .ic{width:50px;height:50px;border-radius:14px;background:var(--paper);display:grid;place-items:center;font-size:24px;margin-bottom:14px}
.cc h3{font-family:var(--serif);color:var(--ink);font-size:19px;margin-bottom:8px}
.cc p{color:var(--muted);font-size:15.5px}

/* স্মৃতি */
.memory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.ph{aspect-ratio:4/3;border-radius:var(--radius);border:2px dashed rgba(16,36,58,.25);display:grid;place-items:center;text-align:center;color:var(--muted);background:repeating-linear-gradient(45deg,#fff,#fff 12px,#fbf7ee 12px,#fbf7ee 24px);padding:20px}
.ph svg{width:44px;height:44px;fill:none;stroke:var(--gold);stroke-width:1.6;display:block;margin:0 auto 8px}

/* কাগজের ঘর */
.shop-sec{background:linear-gradient(160deg,var(--ink),#0b1a2b);color:#fff}
.shop-sec .sec-head h2{color:#fff}
.shop-sec .sec-head p{color:#b9c8d8}
.shop-sec .sec-head .tag{color:var(--gold-2)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:40px}
.cat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius);padding:24px 10px;text-align:center;transition:.25s;font-weight:600}
.cat:hover{background:var(--gold);color:var(--ink);transform:translateY(-4px)}
.cat i{font-style:normal;display:block;font-size:34px;margin-bottom:6px}
.prods{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.prod{background:#fff;color:var(--text);border-radius:var(--radius);overflow:hidden}
.prod .img{aspect-ratio:1;background:var(--paper-2);display:grid;place-items:center;font-size:48px;position:relative}
.prod .badge{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:12px;padding:1px 10px;border-radius:999px}
.prod .body{padding:16px}
.prod h4{font-family:var(--serif);color:var(--ink);font-size:17px}
.prod small{color:var(--muted)}
.prod button{margin-top:12px;width:100%;padding:9px;border-radius:10px;border:0;background:var(--ink);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.prod button:hover{background:var(--red)}
.note{text-align:center;color:#9fb2c6;font-size:14px;margin-top:22px}

/* যোগাযোগ */
.contact{display:grid;grid-template-columns:1fr 1.1fr;gap:34px}
.info-row{display:flex;gap:14px;align-items:center;margin-bottom:20px}
.info-row .ic{width:46px;height:46px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}
.info-row .ic svg{width:20px;height:20px;fill:none;stroke:var(--gold-2);stroke-width:2}
.info-row small{display:block;color:var(--muted);line-height:1.2}
.info-row b{color:var(--ink);font-size:18px}
form input,form textarea{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;font:inherit;margin-bottom:14px;background:var(--paper)}
form input:focus,form textarea:focus{outline:2px solid var(--gold);background:#fff}
#formMsg{margin-top:12px;color:var(--red);font-size:15px;min-height:1.2em}

footer{background:#0a1827;color:#9fb2c6;text-align:center;padding:30px 20px;font-size:15px}
footer b{color:var(--gold-2)}

/* ===== মোবাইল ===== */
@media(max-width:960px){
  .hero .wrap,.about,.contact{grid-template-columns:1fr}
  .portrait{order:-1;width:min(260px,70vw)}
  .grid4,.prods{grid-template-columns:repeat(2,1fr)}
  .cats{grid-template-columns:repeat(3,1fr)}
  .memory-grid{grid-template-columns:repeat(2,1fr)}
  .burger{display:block}
  .menu{display:none;position:absolute;top:100%;left:0;right:0;background:var(--paper);flex-direction:column;padding:12px 20px 18px;border-bottom:1px solid var(--line);box-shadow:0 14px 24px rgba(0,0,0,.1)}
  .menu.open{display:flex}
  .nav .wrap{position:relative}
}
@media(max-width:560px){
  body{font-size:16px}
  .topbar .wrap{justify-content:center}
  .tb-left{gap:12px;font-size:13px}
  .stats .wrap{grid-template-columns:1fr}
  .stat{border-right:0;border-bottom:1px solid var(--line)}
  .grid4,.prods,.memory-grid{grid-template-columns:1fr}
  .cats{grid-template-columns:repeat(2,1fr)}
  section{padding:60px 0}
}
</style>
</head>
